<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: the page runs edge to edge on notched phones; styles.css keeps the UI in env(safe-area-inset-*) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Voidswarm</title>
  <meta name="description" content="Voidswarm — neon 32-player PvPvE arena shooter." />
  <meta name="theme-color" content="#07040f" />
  <!-- v0.5 mobile: installable fullscreen + landscape (src/client/public/). Root-absolute hrefs to public files are
       rewritten under the build's base by Vite (/voidswarm/ on GitHub Pages); the manifest's own URLs are relative. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Voidswarm" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- tab icon: the mark scripts/make-icons.mjs rasterizes into the home-screen / manifest PNGs (a file, not a data: URL,
       so this page names no http(s):// address at all: LAN edition §7) -->
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <!-- the game fonts are self-hosted (fonts.css, public/fonts/): the page works with no internet. Preloading starts the
       two first-screen faces before the script builds the title (crossorigin: fonts are always fetched in CORS mode). -->
  <link rel="preload" href="/fonts/orbitron-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/rajdhani-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body class="device-kbm">
  <div id="app">
    <div id="bg" aria-hidden="true"><div class="sun"></div><div class="grid-floor"></div></div>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="overlays"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
